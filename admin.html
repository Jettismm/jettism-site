<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Jettism Admin</title>
<link rel="icon" type="image/png" href="/jettismicontransparent.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --blue-top:#456FD6;
  --blue-bottom:#3562C8;
  --panel:rgba(12,28,76,.52);
  --panel-solid:#2c4b9b;
  --line:rgba(255,255,255,.22);
  --accent:#FFE800;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}

html{height:100%;background:var(--blue-bottom);overscroll-behavior:none}
body{width:100%;min-height:100%;
  background:radial-gradient(ellipse at 50% 0%,var(--blue-top) 10%,var(--blue-bottom) 100%);
  background-color:var(--blue-bottom);overscroll-behavior:none;
  font-family:'Montserrat',sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center;padding:40px 20px 80px}

h1,h2,label,p,li,span,a,button,dt,dd{text-shadow:0 2px 6px rgba(0,0,0,.45)}

@keyframes fadeDown{0%{opacity:0;transform:translateY(-18px)}100%{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;animation:fadeDown .6s cubic-bezier(.22,.9,.35,1) forwards}
@media (prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1}}

/* ── Lock screen ── */
#lock{display:flex;flex-direction:column;align-items:center;gap:16px;
  margin-top:15vh;width:100%;max-width:320px}
#lock h2{font-weight:700;font-size:20px}
#lock input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:#fff;font-size:14px;outline:none;text-align:center;
  font-family:'Montserrat',sans-serif}
#lock input::placeholder{color:rgba(255,255,255,.6)}
#lock input:focus{border-color:var(--accent)}
#lock button{width:100%;padding:12px;background:#0c1a4a;color:#fff;border:none;border-radius:999px;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
#lock button:disabled{opacity:.5;cursor:not-allowed}
#lock .err{color:#ffb3b3;font-size:13px;font-weight:600;min-height:16px;text-align:center}

/* ── Dashboard ── */
#dash{display:none;width:100%;max-width:1100px;flex-direction:column;gap:20px}
#dash h1{font-weight:800;font-size:26px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.toolbar select{padding:9px 30px 9px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:#fff;font-size:13px;outline:none;font-family:'Montserrat',sans-serif;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='white' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;cursor:pointer}
.toolbar select option,.toolbar select optgroup{background:var(--panel-solid);color:#fff}
.toolbar button{padding:9px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:#fff;font-size:13px;cursor:pointer;font-family:'Montserrat',sans-serif}
.toolbar .count{margin-left:auto;font-size:13px;color:rgba(255,255,255,.85)}
.toolbar button:hover,.toolbar select:hover{border-color:var(--accent)}
.toolbar button:disabled{opacity:.5;cursor:not-allowed}
.toolbar .danger{color:#ffc2c2;border-color:rgba(255,160,160,.55)}
.toolbar .danger:hover{border-color:#ff9a9a;background:rgba(255,107,107,.18)}

.toast{background:rgba(255,232,0,.14);border:1px solid rgba(255,232,0,.55);border-radius:12px;
  padding:12px 16px;font-size:13.5px;font-weight:600;line-height:1.5}

.card-list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:18px 20px;cursor:pointer;transition:border-color .15s ease}
.card:hover{border-color:rgba(255,232,0,.6)}
.card-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.tag{font-weight:700;font-size:11px;letter-spacing:.3px;
  padding:4px 10px;border-radius:999px;background:var(--accent);color:#000;text-shadow:none}
.tag.mc-yes{background:#9bffc6}
.tag.mc-no{background:rgba(255,255,255,.28);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.card-top .discord{font-weight:700;font-size:15px}
.card-top .time{margin-left:auto;font-size:11.5px;color:rgba(255,255,255,.75)}

.card-actions{display:flex;align-items:center;gap:8px;margin-left:8px}
.portfolio-link{font-size:12px;font-weight:600;color:#b6ffd3;text-decoration:none;
  border:1px solid rgba(182,255,211,.5);padding:5px 10px;border-radius:999px;
  transition:background .15s ease}
.portfolio-link:hover{background:rgba(182,255,211,.16)}
.delete-btn{font-size:12px;font-weight:600;color:#ffc2c2;background:transparent;
  border:1px solid rgba(255,160,160,.55);padding:5px 10px;border-radius:999px;
  cursor:pointer;transition:background .15s ease;text-shadow:none;font-family:'Montserrat',sans-serif}
.delete-btn:hover{background:rgba(255,107,107,.18)}
.delete-btn:disabled{opacity:.4;cursor:not-allowed}

.card-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:rgba(255,255,255,.88)}

.detail{display:none;margin-top:8px;padding-top:12px;border-top:1px solid var(--line);
  font-size:13.5px;line-height:1.6;color:#fff}
.detail.open{display:block}
.detail dt{font-weight:700;font-size:12px;color:var(--accent);margin-top:12px;margin-bottom:3px}
.detail dt:first-child{margin-top:0}
.detail dd{overflow-wrap:anywhere}
#empty{text-align:center;color:rgba(255,255,255,.8);padding:40px 0;font-size:14px}
</style>
</head>
<body>

  <div id="lock" class="reveal">
    <h2>Staff access only</h2>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password"/>
    <button id="pw-btn">Enter</button>
    <div class="err" id="pw-err"></div>
  </div>

  <div id="dash">
    <h1 id="dash-title">Applications</h1>
    <div class="toolbar" id="toolbar">
      <select id="filter-position">
        <option value="">Sort by: Position (all)</option>
        <optgroup label="Editing &amp; Content">
          <option>Longform Editor</option>
          <option>Shortform Editor</option>
          <option>Clipper</option>
          <option>Clip Editor</option>
          <option>Thumbnail Designer</option>
          <option>Animator</option>
        </optgroup>
        <optgroup label="Minecraft">
          <option>Minecraft Builder</option>
          <option>Minecraft Mod Developer</option>
        </optgroup>
      </select>
      <select id="filter-mc">
        <option value="">Minecraft exp: (all)</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
      <select id="sort-order">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
      </select>
      <button id="refresh-btn">Refresh</button>
      <button id="dedupe-btn" class="danger" title="Removes repeat applications that share a Discord username or portfolio link">Remove duplicates</button>
      <div class="count" id="count"></div>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="card-list" id="card-list"></div>
    <div id="empty" style="display:none">No applications match these filters.</div>
  </div>

<script>
  const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbzsQADEUD9yV2B9Z-f-W0VIOMJDJWJcOeKhpmMAoKSk7PEeR-vpRpueieDb2jahm9XgOA/exec";
  const HOME_URL = "https://jettism.com/";

  // The password is never stored in this file. It's checked by your Apps Script (server-side).
  let currentPassword = null;
  let allRows = [];

  const $ = function(id){ return document.getElementById(id); };

  function getDeviceId(){
    let id = null;
    try { id = localStorage.getItem('jettism_admin_device'); } catch(e){}
    if(!id){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
         : 'dev-' + Date.now() + '-' + Math.random().toString(36).slice(2);
      try { localStorage.setItem('jettism_admin_device', id); } catch(e){}
    }
    return id;
  }
  const deviceId = getDeviceId();

  const lock = $('lock'), dash = $('dash');
  const pwInput = $('pw'), pwBtn = $('pw-btn'), pwErr = $('pw-err');

  // One place that talks to the Apps Script. A ban sends the visitor to the home page.
  async function api(action, extra, password){
    const qs = new URLSearchParams(Object.assign(
      { action: action, password: password != null ? password : currentPassword, device: deviceId },
      extra || {}
    ));
    const res = await fetch(ENDPOINT_URL + '?' + qs.toString());
    const json = await res.json();
    if(json && json.error === 'banned'){ window.location.href = HOME_URL; }
    return json;
  }

  function showToast(text){
    const t = $('toast');
    t.textContent = text;
    t.hidden = !text;
  }

  async function attemptUnlock(){
    const pw = pwInput.value;
    if(!pw) return;
    pwBtn.disabled = true;
    pwBtn.textContent = 'Checking...';
    pwErr.textContent = '';

    try {
      const json = await api('list', null, pw);

      if(json && json.error === 'banned'){ return; }
      if(json && json.error === 'unconfigured'){
        pwErr.textContent = "The admin password hasn't been set in the Apps Script yet.";
        pwBtn.disabled = false; pwBtn.textContent = 'Enter';
        return;
      }
      if(json && json.error){
        const left = json.attemptsLeft;
        pwErr.textContent = left != null
          ? 'Incorrect password. ' + left + ' attempt' + (left === 1 ? '' : 's') + ' left.'
          : 'Incorrect password.';
        pwBtn.disabled = false; pwBtn.textContent = 'Enter';
        return;
      }

      currentPassword = pw;
      allRows = json;
      lock.style.display = 'none';
      dash.style.display = 'flex';
      ['dash-title', 'toolbar'].forEach(function(id, i){
        const el = $(id);
        el.classList.add('reveal');
        el.style.animationDelay = (i * 0.06) + 's';
      });
      render(true);
    } catch(err){
      pwErr.textContent = 'Could not reach the server. Try again.';
      pwBtn.disabled = false; pwBtn.textContent = 'Enter';
    }
  }

  pwBtn.addEventListener('click', attemptUnlock);
  pwInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') attemptUnlock(); });

  async function refreshData(){
    if(!currentPassword) return;
    try{
      const json = await api('list');
      if(json && json.error){ return; }
      allRows = json;
      render(true);
    }catch(err){}
  }

  async function deleteApplicant(row, btnEl){
    if(!currentPassword) return;
    const r = allRows.find(function(x){ return x._row === row; });
    if(!r) return;
    if(!confirm('Delete this application? This cannot be undone.')) return;

    btnEl.disabled = true;
    btnEl.textContent = 'Deleting...';
    try{
      const json = await api('delete', { row: row, discord: r.discord || '', ts: r.submitted_at || '' });
      if(json && json.error === 'banned'){ return; }
      if(json && json.error === 'stale'){
        showToast('That list was out of date, so nothing was deleted. It has been refreshed.');
        await refreshData();
        return;
      }
      if(json && json.error){
        alert('Could not delete. Please refresh and try again.');
        btnEl.disabled = false; btnEl.textContent = 'Delete';
        return;
      }
      showToast('');
      await refreshData();   // row numbers shift after a delete, so reload
    } catch(err){
      alert('Could not reach the server.');
      btnEl.disabled = false; btnEl.textContent = 'Delete';
    }
  }

  async function removeDuplicates(){
    if(!currentPassword) return;
    const sure = confirm(
      'Remove duplicate applications?\n\n' +
      'Applications that share the same Discord username OR the same portfolio link are treated as one person. ' +
      'The earliest one is kept and the rest are removed.\n\n' +
      'The removed rows are saved first in a "Removed duplicates" tab of your Google Sheet, so you can restore them.'
    );
    if(!sure) return;

    const b = $('dedupe-btn');
    b.disabled = true;
    b.textContent = 'Removing...';
    try{
      const json = await api('dedupe');
      if(json && json.error === 'banned'){ return; }
      if(json && json.error){
        showToast('Could not remove duplicates. Please refresh and try again.');
      } else if(json.removed === 0){
        showToast('No duplicates found. Every application has a unique username and portfolio link.');
      } else {
        showToast('Removed ' + json.removed + ' duplicate application' + (json.removed === 1 ? '' : 's') +
          '. ' + json.kept + ' remain. The removed ones are backed up in the "Removed duplicates" tab of your sheet.');
      }
      await refreshData();
    } catch(err){
      showToast('Could not reach the server.');
    }
    b.disabled = false;
    b.textContent = 'Remove duplicates';
  }

  $('refresh-btn').addEventListener('click', function(){ showToast(''); refreshData(); });
  $('dedupe-btn').addEventListener('click', removeDuplicates);
  $('filter-position').addEventListener('change', function(){ render(false); });
  $('filter-mc').addEventListener('change', function(){ render(false); });
  $('sort-order').addEventListener('change', function(){ render(false); });

  // "https://drive.google.com/..." -> "Drive", "https://youtube.com/..." -> "YouTube", etc.
  function getLinkLabel(url){
    if(!url) return 'Link';
    let hostname;
    try{
      hostname = new URL(url).hostname.toLowerCase().replace(/^www\./, '');
    }catch(e){
      return 'Link';
    }
    const knownSites = [
      { match: 'drive.google.com', label: 'Drive' },
      { match: 'docs.google.com', label: 'Google Docs' },
      { match: 'youtube.com', label: 'YouTube' },
      { match: 'youtu.be', label: 'YouTube' },
      { match: 'twitter.com', label: 'Twitter' },
      { match: 'x.com', label: 'X' },
      { match: 'instagram.com', label: 'Instagram' },
      { match: 'tiktok.com', label: 'TikTok' },
      { match: 'vimeo.com', label: 'Vimeo' },
      { match: 'dropbox.com', label: 'Dropbox' },
      { match: 'mega.nz', label: 'Mega' },
      { match: 'behance.net', label: 'Behance' },
      { match: 'artstation.com', label: 'ArtStation' },
      { match: 'discord.com', label: 'Discord' },
      { match: 'discord.gg', label: 'Discord' },
      { match: 'github.com', label: 'GitHub' },
      { match: 'modrinth.com', label: 'Modrinth' },
      { match: 'curseforge.com', label: 'CurseForge' },
      { match: 'planetminecraft.com', label: 'Planet Minecraft' },
      { match: 'notion.so', label: 'Notion' },
      { match: 'twitch.tv', label: 'Twitch' },
      { match: 'onedrive.live.com', label: 'OneDrive' },
      { match: 'streamable.com', label: 'Streamable' },
      { match: 'imgur.com', label: 'Imgur' }
    ];
    for(let i = 0; i < knownSites.length; i++){
      const site = knownSites[i];
      if(hostname === site.match || hostname.endsWith('.' + site.match)) return site.label;
    }
    const mainPart = hostname.split('.')[0];
    if(!mainPart) return 'Link';
    return mainPart.charAt(0).toUpperCase() + mainPart.slice(1);
  }

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }
  // Only ever link to http(s) addresses (stops javascript: links in the portfolio field)
  function safeHref(u){
    return /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '#';
  }

  function render(animate){
    const posFilter = $('filter-position').value;
    const mcFilter = $('filter-mc').value;
    const order = $('sort-order').value;

    const rows = allRows.filter(function(r){
      return (!posFilter || r.position === posFilter) &&
             (!mcFilter || r.minecraft_experience === mcFilter);
    });

    rows.sort(function(a, b){
      const ta = new Date(a.submitted_at).getTime() || 0;
      const tb = new Date(b.submitted_at).getTime() || 0;
      return order === 'new' ? tb - ta : ta - tb;
    });

    const list = $('card-list');
    const empty = $('empty');
    $('count').textContent = rows.length + ' application' + (rows.length === 1 ? '' : 's');

    if(rows.length === 0){
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    list.innerHTML = rows.map(function(r){
      const when = r.submitted_at ? new Date(r.submitted_at).toLocaleString() : '';
      const mc = r.minecraft_experience;
      // Minecraft Builder / Mod Developer don't get the flashback question, so no tag for them
      const mcTag = (mc === 'Yes' || mc === 'No')
        ? '<span class="tag ' + (mc === 'Yes' ? 'mc-yes' : 'mc-no') + '">MC: ' + escapeHtml(mc) + '</span>' : '';
      return '' +
        '<div class="card" data-row="' + escapeHtml(r._row) + '">' +
          '<div class="card-top">' +
            '<span class="tag">' + escapeHtml(r.position) + '</span>' + mcTag +
            '<span class="discord">' + escapeHtml(r.discord) + '</span>' +
            '<span class="time">' + escapeHtml(when) + '</span>' +
            '<div class="card-actions">' +
              '<a class="portfolio-link" href="' + escapeHtml(safeHref(r.portfolio)) + '" target="_blank" rel="noopener noreferrer">' +
                escapeHtml(getLinkLabel(r.portfolio)) + ' ↗</a>' +
              '<button class="delete-btn" data-row="' + escapeHtml(r._row) + '">Delete</button>' +
            '</div>' +
          '</div>' +
          '<div class="card-meta">' +
            '<span>TZ: ' + escapeHtml(r.timezone) + '</span>' +
            '<span>Age: ' + escapeHtml(r.age) + '</span>' +
            '<span>Hours/day: ' + escapeHtml(r.hours) + '</span>' +
            '<span>Payout: ' + escapeHtml(r.payout) + '</span>' +
          '</div>' +
          '<dl class="detail">' +
            '<dt>Experience</dt><dd>' + escapeHtml(r.experience) + '</dd>' +
            '<dt>What they bring</dt><dd>' + escapeHtml(r.bring) + '</dd>' +
            '<dt>What makes them stand out</dt><dd>' + escapeHtml(r.standout) + '</dd>' +
          '</dl>' +
        '</div>';
    }).join('');

    list.querySelectorAll('.card').forEach(function(card, i){
      if(animate){
        card.classList.add('reveal');
        card.style.animationDelay = (Math.min(i, 14) * 0.04) + 's';
      }
      card.addEventListener('click', function(){
        card.querySelector('.detail').classList.toggle('open');
      });
    });
    list.querySelectorAll('.portfolio-link').forEach(function(a){
      a.addEventListener('click', function(e){ e.stopPropagation(); });
    });
    list.querySelectorAll('.delete-btn').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        deleteApplicant(parseInt(b.getAttribute('data-row'), 10), b);
      });
    });
  }
</script>
</body>
</html>

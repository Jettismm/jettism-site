  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#7FA3F2;--bg-edge:#7099EE;--ink:#0F1E45;--strip-w:260px;--shorts-w:170px}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;
      background:radial-gradient(ellipse at 50% 45%,#8DAEF5 0%,var(--bg) 45%,var(--bg-edge) 100%);
      font-family:'Montserrat',system-ui,sans-serif;color:var(--ink)}

    /* fast fade-in on load */
    @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .fade{opacity:0;animation:fadein .5s ease-out forwards}
    .d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.1s}

    /* side strips */
    .strip{position:fixed;top:0;bottom:0;overflow:hidden;z-index:5}
    .strip.left{left:28px;width:var(--strip-w)}
    .strip.right{right:28px;width:var(--shorts-w)}
    .strip::before,.strip::after{content:'';position:absolute;left:0;right:0;height:110px;z-index:2;pointer-events:none}
    .strip::before{top:0;background:linear-gradient(to bottom,var(--bg-edge),transparent)}
    .strip::after{bottom:0;background:linear-gradient(to top,var(--bg-edge),transparent)}
    @keyframes scrollup{from{transform:translateY(0)}to{transform:translateY(-50%)}}
    .track{display:flex;flex-direction:column;gap:12px;padding:6px 0;animation:scrollup linear infinite}
    .strip:hover .track{animation-play-state:paused}
    .card{display:block;position:relative;flex-shrink:0;overflow:hidden;text-decoration:none;
          box-shadow:0 4px 14px rgba(15,30,69,.18);transition:transform .2s ease}
    .card:hover{transform:scale(1.03)}
    .card img{width:100%;height:100%;object-fit:cover;display:block;background:rgba(255,255,255,.15)}
    .long{width:var(--strip-w);aspect-ratio:16/9;border-radius:12px}
    .short{width:var(--shorts-w);aspect-ratio:9/16;border-radius:12px}
    .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
          font-size:22px;color:#fff;background:rgba(15,30,69,.25);opacity:0;transition:opacity .2s}
    .card:hover .play{opacity:1}

    /* center */
    main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
         gap:44px;z-index:10;padding:0 16px;pointer-events:none}
    main>*{pointer-events:auto}
    .brand{display:flex;align-items:center;gap:22px}
    .brand img{width:clamp(90px,11vw,150px);height:auto;filter:drop-shadow(0 4px 10px rgba(15,30,69,.25));
               user-select:none;-webkit-user-drag:none}
    .brand h1{font-weight:600;font-size:clamp(28px,4.2vw,52px);letter-spacing:-.5px;white-space:nowrap}
    .join{display:inline-block;padding:14px 38px;border-radius:999px;background:var(--ink);color:#fff;
          font-weight:500;font-size:clamp(15px,1.5vw,18px);text-decoration:none;
          transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 6px 18px rgba(15,30,69,.25)}
    .join:hover{transform:scale(1.05)}.join:active{transform:scale(.97)}
    .social-row{display:flex;align-items:center;gap:24px;color:var(--ink)}
    .si-btn{display:flex;color:inherit;transition:transform .15s ease,opacity .15s ease}
    .si-btn:hover{transform:scale(1.18);opacity:.7}
    .si-btn svg{width:30px;height:30px}

    @media(max-width:1180px){:root{--strip-w:200px;--shorts-w:140px}}
    @media(max-width:980px){.brand{flex-direction:column;gap:12px}}
    @media(max-width:820px){.strip{display:none}}
    @media(prefers-reduced-motion:reduce){.track{animation:none}.fade{animation-duration:.01s}}
  </style>
